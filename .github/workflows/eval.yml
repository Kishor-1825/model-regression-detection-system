name: Prompt Regression Evaluation

on:
  pull_request:
    paths:
      - "prompts/**"
      - "data/**"
      - "thresholds.yaml"
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate prompt version (e.g. v2)"
        required: true
        default: "v2"
      baseline:
        description: "Baseline prompt version (e.g. v1)"
        required: true
        default: "v1"

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate-regression:
    name: LLM Regression & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Model Regression Evaluation Engine
        id: eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          CANDIDATE="${{ github.event.inputs.candidate || 'v2' }}"
          BASELINE="${{ github.event.inputs.baseline || 'v1' }}"
          echo "Running regression evaluation for candidate=$CANDIDATE against baseline=$BASELINE"
          python -m src.cli --candidate "$CANDIDATE" --baseline "$BASELINE" --out report

      - name: Upload HTML Diff Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diff-report
          path: report/
          retention-days: 14

      - name: Comment Evaluation Results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'report/summary.md';
            if (fs.existsSync(summaryPath)) {
              const body = fs.readFileSync(summaryPath, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              console.log('summary.md not found, skipping PR comment.');
            }
